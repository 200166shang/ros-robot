[tool.ruff]
line-length = 160
indent-width = 4
target-version = "py38"
extend-exclude = ["build", "install", "log", "local-assets", "local-data", "models", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["robot_agent", "robot_voice"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
