[tool.ruff]
# ROS 2 Foxy uses Python 3.8; scope checks to migrated online/demo modules.
target-version = "py38"
line-length = 79
include = ["pyproject.toml", "**/online_*.py", "**/robot_agent/**/*.py", "**/robot_agent/setup.py", "**/robot_audio/audio_io.py", "**/robot_audio/pcm_input.py", "**/test_pcm_input.py", "**/robot_audio/audio_sources.py", "**/test_audio_io.py", "**/test_audio_sources.py", "**/robot_audio/setup.py", "**/robot_audio/__init__.py", "**/voice_frontend_node.py", "**/test_online_*.py", "**/tracking_control_node.py", "**/person_tracking_demo.launch.py", "**/online_agent.launch.py", "**/tracking_control_acceptance_probe.py", "**/test_tracking_launch.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.isort]
known-first-party = ["robot_agent", "robot_audio", "robot_voice"]
