usb_camera:
  ros__parameters:
    device: /dev/video0
    width: 1280
    height: 720
    fps: 30
    lazy: true

img_decode:
  ros__parameters:
    input_topic: /image_raw/compressed
    output_topic: /camera/image_raw
    scale: 1.0
    frame_divider: 1
    lazy: true

rknn_yolov6:
  ros__parameters:
    input_topic: /camera/image_raw
    detections_topic: /ai_msg_det
    annotated_topic: /camera/image_det
    confidence_threshold: 0.30
    nms_threshold: 0.30
    always_process: false

object_track:
  ros__parameters:
    image_topic: /camera/image_det
    input_topic: /ai_msg_det
    annotated_topic: /camera/image_det_track
    output_topic: /tracking/cmd_vel_safe
    target_class: person
    dry_run: true
    angular_gain: 0.01
    max_angular: 3.0
    minimum_area: 20

web_video_server:
  ros__parameters:
    host: 127.0.0.1
    port: 8080
    jpeg_quality: 75
    max_detection_fps: 10.0
