usb_camera:
  ros__parameters:
    device: /dev/video0
    width: 1280
    height: 720
    fps: 30
    lazy: true

img_decode:
  ros__parameters:
    input_topic: /image_raw/compressed
    output_topic: /camera/image_raw
    scale: 1.0
    frame_divider: 1
    lazy: true

rknn_yolov6:
  ros__parameters:
    input_topic: /camera/image_raw
    detections_topic: /ai_msg_det
    annotated_topic: /camera/image_det
    confidence_threshold: 0.30
    nms_threshold: 0.30
    always_process: false

object_track:
  ros__parameters:
    image_topic: /camera/image_det
    input_topic: /ai_msg_det
    annotated_topic: /camera/image_det_track
    output_topic: /tracking/cmd_vel_safe
    lidar_topic: /scan
    target_class: person
    dry_run: true
    angular_gain: 0.01
    max_angular: 3.0
    minimum_area: 20
    control_linear: true
    linear_gain: 0.5
    max_linear: 0.15
    keep_distance: 0.3
    minimum_range: 0.05
    maximum_range: 5.0
    # Replace this provisional C270 pinhole estimate with measured calibration.
    camera_fx: 1410.6
    camera_fy: 1410.6
    camera_cx: 640.0
    camera_cy: 360.0
    camera_frame: camera
    laser_frame: laser_link
    transform_timeout_sec: 10.0

web_video_server:
  ros__parameters:
    host: 127.0.0.1
    port: 8080
    jpeg_quality: 75
    max_detection_fps: 10.0
